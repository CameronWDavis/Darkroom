[package]
name = "darkroom-pdf"
version = "0.1.0"
edition = "2021"
publish = false
description = "Darkroom's PDF workspace engine: a WebAssembly bridge over PdfCraft's library crates"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
# PdfCraft (MIT OR Apache-2.0), pinned to one commit: its API is still 0.x.
pdfcraft-engine = { git = "https://github.com/storytold/pdfcraft", rev = "f1af1e2e79ba9d2df3cb7debf88098b952dc6fd7" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "f1af1e2e79ba9d2df3cb7debf88098b952dc6fd7" }
pdfcraft-model = { git = "https://github.com/storytold/pdfcraft", rev = "f1af1e2e79ba9d2df3cb7debf88098b952dc6fd7" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
