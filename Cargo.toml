[package]
name = "darkroom"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "pdf"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
fontdue = { version = "0.9", default-features = false, features = ["std"] }

# default-features = false keeps rayon and the formats we don't need out of the
# wasm binary. Add "tiff" / "bmp" here if you want to accept those on import.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }

# "deflate" resolves to flate2's pure-Rust backend. If your resolver pulls in a
# C zlib backend the wasm build will fail at link time -- see README.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# PdfCraft carries small safety patches to these crates in its `vendor/`
# folder. Its own [patch] table does not apply to projects that depend on it,
# so the PDF engine repeats it here, at the same pinned commit.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "f1af1e2e79ba9d2df3cb7debf88098b952dc6fd7" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "f1af1e2e79ba9d2df3cb7debf88098b952dc6fd7" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "f1af1e2e79ba9d2df3cb7debf88098b952dc6fd7" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "f1af1e2e79ba9d2df3cb7debf88098b952dc6fd7" }
